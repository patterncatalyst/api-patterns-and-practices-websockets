# The AsyncAPI contract-drift CI gate — the WebSockets analog of the gRPC
# site's `buf lint` / `buf breaking` / example-matrix pipeline
# (../../api-patterns-and-practices-grpc/.github/workflows/contracts.yml),
# adapted for a single-file AsyncAPI 3 document instead of a Buf module.
#
# Moved out of pages.yml (which kept only a validate-only `contract` job,
# DRQ-012) once the examples generate from the contract (DRQ-011, DRQ-018):
# this is the full "regenerate both stacks and fail on drift" gate. Don't
# duplicate `asyncapi validate` in pages.yml — it runs here only.
name: contracts

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate the AsyncAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: asyncapi validate
        run: npx -y @asyncapi/cli@6.2.1 validate contracts/asyncapi.yaml

  breaking:
    name: Detect breaking changes (vs main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # asyncapi diff needs the main ref available

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: asyncapi diff (vs main)
        run: |
          # The evolution gate — the AsyncAPI analog of the gRPC site's
          # `buf breaking`. On the first introduction main has no baseline
          # contract, so skip; once this lands on main, every later change is
          # diffed against it.
          #
          # `asyncapi diff`'s own `-t breaking` classification only covers
          # structural changes (channel/operation/server/address edits) — it
          # leaves payload-schema changes (a removed enum member, a retyped
          # or re-patterned field, a newly-required property) as
          # "unclassified" rather than committing to breaking/non-breaking
          # (verified locally against this contract). The jq filter below
          # closes that gap: anything the CLI calls "breaking" outright, OR
          # any `remove`, OR an `edit` of a `type`/`pattern`, OR an `add` to
          # a `required` array, fails the gate. A purely additive, optional
          # field is an `add` to `properties` only and is NOT flagged.
          if git ls-tree -r origin/main --name-only -- contracts/asyncapi.yaml 2>/dev/null | grep -q 'asyncapi\.yaml$'; then
            git show origin/main:contracts/asyncapi.yaml > /tmp/asyncapi.main.yaml
            npx -y @asyncapi/cli@6.2.1 diff /tmp/asyncapi.main.yaml contracts/asyncapi.yaml \
              -t all -f json > /tmp/asyncapi.diff.json
            breaking="$(jq '[.changes[]? | select(
                .type == "breaking" or
                .action == "remove" or
                (.action == "edit" and (.path | test("/(type|pattern)$"))) or
                (.action == "add" and (.path | test("/required/[0-9]+$")))
              )]' /tmp/asyncapi.diff.json)"
            count="$(jq 'length' <<<"$breaking")"
            if [ "$count" -gt 0 ]; then
              echo "BREAKING changes detected vs origin/main:"
              jq '.' <<<"$breaking"
              exit 1
            fi
            echo "no breaking changes vs origin/main"
          else
            echo "no baseline contract on main yet — skipping breaking check (first introduction)"
          fi

  drift:
    # DRIFT_APPS is the single place that lists every example whose Python
    # model + Quarkus HandlingEventContractTest must be regenerated/run
    # against build/handling-event.schema.json on every change to
    # contracts/asyncapi.yaml. All four apps (part3's plain replay, part4's
    # connection-concerns and backplane forks — DRQ-020 — and part5's
    # JSON/Protobuf dual-encoding fork — DRQ-025) generate their JSON model
    # from that SAME extracted schema, so one shared loop over this list
    # keeps the gate DRY instead of four near-duplicate step blocks. Add a
    # new app's directory name here when Part 6+ forks again.
    #
    # part5-performance is the one entry with an EXTRA generation step: its
    # Python side also needs a Protobuf stub (python/scripts/generate-proto.sh,
    # contracts/handling-event.proto -> app/handling_event_pb2.py) before
    # pytest can import it, and its Quarkus side has a second test class
    # (HandlingEventProtoRoundTripTest) that asserts the proto-decoded shape
    # against the same schema. Both loops below detect part5 generically
    # (by the presence of the extra script / test class) rather than
    # hardcoding the app name, so the pattern already covers a Part 6+ app
    # that adds its own extra encoding.
    name: Contract-drift gate (extract, regenerate, conformance-test all apps/stacks)
    runs-on: ubuntu-latest
    env:
      DRIFT_APPS: "part3-handling-events part4-connection part4-backplane part5-performance"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - uses: astral-sh/setup-uv@v10.3.0   # no floating v10 tag; pin exact
        with:
          version: "0.13.1"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: |
            examples/part3-handling-events/python/uv.lock
            examples/part4-connection/python/uv.lock
            examples/part4-backplane/python/uv.lock
            examples/part5-performance/python/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Extract the contract-derived JSON Schema
        run: python3 -I scripts/extract-message-schema.py build/handling-event.schema.json

      - name: Regenerate Python models (+ proto stub where present) + Python conformance tests (every DRIFT_APPS entry)
        run: |
          set -euo pipefail
          for app in $DRIFT_APPS; do
            echo "::group::python drift — $app"
            (
              cd "examples/$app/python"
              ./scripts/generate-models.sh
              # part5-performance's Python side carries a SECOND generation
              # step (the Protobuf stub, DRQ-025) that part3/part4 don't
              # have — run it only when the app actually has it, so this
              # loop stays generic across DRIFT_APPS rather than branching
              # on the app name.
              if [ -x scripts/generate-proto.sh ]; then
                ./scripts/generate-proto.sh
              fi
              uv run pytest tests/test_contract.py -v
            )
            echo "::endgroup::"
          done

      - name: Quarkus conformance tests (HandlingEventContractTest + any proto round-trip test, every DRIFT_APPS entry)
        run: |
          set -euo pipefail
          for app in $DRIFT_APPS; do
            echo "::group::quarkus drift — $app"
            (
              cd "examples/$app/quarkus"
              # part5-performance also ships HandlingEventProtoRoundTripTest
              # (DRQ-025) — run it in the SAME `./mvnw test` invocation
              # alongside HandlingEventContractTest when it exists, instead
              # of adding a separate step, so this stays one shared loop.
              if [ -f src/test/java/com/patterncatalyst/shipping/handlingevents/HandlingEventProtoRoundTripTest.java ]; then
                ./mvnw -B test -Dtest=HandlingEventContractTest,HandlingEventProtoRoundTripTest
              else
                ./mvnw -B test -Dtest=HandlingEventContractTest
              fi
            )
            echo "::endgroup::"
          done

  buf-parity:
    # DRQ-025 — the Protobuf side of the contract gets the SAME two-layer
    # treatment the gRPC sibling site's contracts.yml gives its proto module
    # (buf lint/build/breaking), PLUS a gate buf itself cannot run: buf only
    # ever looks at contracts/handling-event.proto in isolation, so it can't
    # catch the proto drifting away from contracts/asyncapi.yaml (a field
    # renamed or dropped on one side only, an enum member reordered). That's
    # what scripts/check-proto-parity.py exists for — it diffs the compiled
    # proto descriptor against the SAME build/handling-event.schema.json the
    # `drift` job's Python/Quarkus regeneration also consumes.
    name: buf lint/build/breaking + AsyncAPI<->proto parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # buf breaking needs the main ref available

      - uses: bufbuild/buf-setup-action@v1.50.0   # action version; buf CLI pinned below
        with:
          version: "1.74.0"   # contracts/README.md / Ch0 version matrix, DRQ-025 — no floating tag
          github_token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: buf lint
        working-directory: contracts
        run: buf lint

      - name: buf build (compile; all imports resolve)
        working-directory: contracts
        run: buf build -o /dev/null

      - name: buf breaking (vs main)
        working-directory: contracts
        run: |
          # The evolution gate — same first-introduction-skip guard the
          # `breaking` job above uses for the AsyncAPI side. On the first
          # introduction main has no baseline proto, so skip; once this
          # lands on main, every later change is checked against it.
          if git ls-tree -r origin/main --name-only -- contracts/handling-event.proto 2>/dev/null | grep -q 'handling-event\.proto$'; then
            buf breaking --against '../.git#branch=main,subdir=contracts'
          else
            echo "no baseline proto on main yet — skipping breaking check (first introduction)"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install protoc + Python deps for the parity check
        # check-proto-parity.py shells out to `protoc --descriptor_set_out` and
        # imports google.protobuf; extract-message-schema.py needs PyYAML. The
        # GitHub runner's system Python ships none of these, so install them
        # into the setup-python interpreter (python3 -I still sees its own
        # site-packages, just not the user site). protoc comes from apt — it
        # only compiles one trivial proto to a descriptor set here.
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          python3 -m pip install "protobuf==7.36.2" "PyYAML>=6"

      - name: AsyncAPI <-> proto parity (DRQ-025)
        # Always runs (not gated behind the breaking-check branch above) —
        # this is the drift gate between the two contract halves, independent
        # of whether there's a baseline to diff against yet.
        run: |
          python3 -I scripts/extract-message-schema.py build/handling-event.schema.json
          python3 -I scripts/check-proto-parity.py

  discover-examples:
    name: Discover examples
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.find.outputs.examples }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        name: Build the example matrix from examples/*/verify.sh
        run: |
          shopt -s nullglob
          names=()
          for s in examples/*/verify.sh; do
            names+=("$(basename "$(dirname "$s")")")
          done
          if [ ${#names[@]} -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "examples=[]" >> "$GITHUB_OUTPUT"
            echo "No examples/*/verify.sh yet."
            exit 0
          fi
          json=$(printf '%s\n' "${names[@]}" | sort | jq -R . | jq -cs .)
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "examples=$json" >> "$GITHUB_OUTPUT"
          echo "Matrix: $json"

  examples:
    name: "verify: ${{ matrix.example }}"
    needs: discover-examples
    if: needs.discover-examples.outputs.any == 'true'
    runs-on: ubuntu-latest
    # Generous per-matrix-job cap: part4-backplane's verify.sh runs THREE
    # sequential docker-compose up/down stages (stateless, kafka, redis),
    # each with its own broker cold start, inside the retry loop below (up
    # to 3 full attempts) — comfortably longer than part3/part4-connection's
    # single-stage runs, which finish in a few minutes. One shared cap keeps
    # the matrix definition simple; it just needs to be big enough for the
    # slowest member.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover-examples.outputs.examples) }}
    steps:
      - uses: actions/checkout@v5
      # verify.sh Step 4 (client reconnect check) runs the uv-managed Python
      # client on the host via `uv run`; docker alone is not enough. uv also
      # provisions the Python interpreter the client needs.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Verify ${{ matrix.example }} (response semantics vs contract, both stacks)
        # Retry up to 3x: each verify.sh is self-contained (compose up ->
        # assert -> compose down via lib.sh's EXIT trap), so a retry starts
        # from a clean slate. This absorbs transient CI flakes — image pulls,
        # JVM cold-start timing, websocat download — without masking real
        # failures (a deterministic bug fails all three attempts).
        run: |
          for attempt in 1 2 3; do
            echo "::group::verify attempt $attempt/3 — ${{ matrix.example }}"
            if bash "examples/${{ matrix.example }}/verify.sh"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed for ${{ matrix.example }}"
            [ "$attempt" -lt 3 ] && { echo "retrying in 15s..."; sleep 15; }
          done
          echo "all 3 attempts failed for ${{ matrix.example }}"
          exit 1

  examples-summary:
    name: Verify stacks against the contract
    needs: [discover-examples, examples]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the example matrix result
        run: |
          result="${{ needs.examples.result }}"
          echo "examples matrix result: $result"
          if [ "${{ needs.discover-examples.outputs.any }}" = "true" ] && [ "$result" != "success" ]; then
            echo "One or more example verify.sh jobs failed."
            exit 1
          fi
          echo "All example verifications passed (or none to run)."

  k6-smoke:
    # DRQ-023/DRQ-027 — k6 is a GATED smoke run, not merely opt-in: a k6
    # threshold failure here fails this job, and thus the PR. Deliberately
    # SMOKE-level (examples/part4-*/ and part5-performance/k6/smoke.js: a
    # handful of VUs, one iteration each, no ramp) so this stays a fast gate
    # — the heavier, multi-stage/broker scenarios (Ch15/16/18) and the
    # comparative JSON-vs-Protobuf throughput benchmark (Ch19/20's
    # k6/benchmark.js, local-only per DRQ-027) stay out of this job; this
    # job only proves each live channel itself (auth-gated on
    # part4-connection, open on part4-backplane's default profile and on
    # part5-performance) still accepts a connection and streams the fixture
    # — on part5-performance, over BOTH negotiated wire encodings.
    name: k6 smoke load (gated) — Part 4 + Part 5
    runs-on: ubuntu-latest
    env:
      # Pin: k6 2.3.0 (contracts/README.md / Ch0 version matrix / DRQ-023)
      # — no floating tag.
      K6_IMAGE: docker.io/grafana/k6:2.3.0
      # Must match examples/part4-connection/compose.yaml's WS_JWT_SECRET
      # exactly (see that file's own comment on why it's a dedicated
      # test-only value, not either image's "dev-secret-change-me" default).
      SHARED_JWT_SECRET: part4-verify-harness-shared-secret-value
      BOOKING_ID: bkg_01HZY3KX7QZJ8N6VWT2E4R9F0A
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.3.0   # no floating v10 tag; pin exact
        with:
          version: "0.13.1"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: |
            examples/part4-connection/python/uv.lock

      # ---------------------------------------------------------------
      # part4-connection — auth-gated channel, both stacks
      # ---------------------------------------------------------------
      - name: part4-connection — docker compose up
        working-directory: examples/part4-connection
        run: docker compose up -d --build quarkus python

      - name: part4-connection — wait for both stacks to report healthy
        run: |
          set -euo pipefail
          for svc in quarkus python; do
            status=""
            for _ in $(seq 1 40); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "part4-connection-$svc" 2>/dev/null || true)"
              [ "$status" = "healthy" ] && break
              sleep 3
            done
            if [ "$status" != "healthy" ]; then
              echo "::error::part4-connection-$svc never became healthy (last status: $status)"
              docker logs "part4-connection-$svc" || true
              exit 1
            fi
          done

      - name: part4-connection — mint a shared-secret JWT
        working-directory: examples/part4-connection/python
        run: |
          token="$(WS_JWT_SECRET="$SHARED_JWT_SECRET" uv run python -m app.mint_token)"
          echo "::add-mask::$token"
          echo "K6_TOKEN=$token" >> "$GITHUB_ENV"

      - name: part4-connection — k6 smoke (quarkus, :8080)
        run: |
          docker run --rm --network host \
            -e K6_WS_URL="ws://localhost:8080/ws/v1/bookings/${BOOKING_ID}/handling-events" \
            -e K6_TOKEN="$K6_TOKEN" \
            -v "$(pwd)/examples/part4-connection/k6:/scripts" \
            "$K6_IMAGE" run /scripts/smoke.js

      - name: part4-connection — k6 smoke (python, :8081)
        run: |
          docker run --rm --network host \
            -e K6_WS_URL="ws://localhost:8081/ws/v1/bookings/${BOOKING_ID}/handling-events" \
            -e K6_TOKEN="$K6_TOKEN" \
            -v "$(pwd)/examples/part4-connection/k6:/scripts" \
            "$K6_IMAGE" run /scripts/smoke.js

      - name: part4-connection — docker compose down
        if: always()
        working-directory: examples/part4-connection
        run: docker compose down -v --remove-orphans

      # ---------------------------------------------------------------
      # part4-backplane — default (stateless) profile only, single
      # instance per stack (quarkus-a/python-a); no broker, no auth gate
      # (PROTOCOL.md). The Kafka/Redis-backed replay and fan-out scenarios
      # stay in verify.sh — this is a fast liveness smoke only.
      # ---------------------------------------------------------------
      - name: part4-backplane — docker compose up (default profile, a-instances only)
        working-directory: examples/part4-backplane
        run: docker compose up -d --build quarkus-a python-a

      - name: part4-backplane — wait for quarkus-a/python-a to report healthy
        run: |
          set -euo pipefail
          for svc in quarkus-a python-a; do
            status=""
            for _ in $(seq 1 40); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "part4-backplane-$svc" 2>/dev/null || true)"
              [ "$status" = "healthy" ] && break
              sleep 3
            done
            if [ "$status" != "healthy" ]; then
              echo "::error::part4-backplane-$svc never became healthy (last status: $status)"
              docker logs "part4-backplane-$svc" || true
              exit 1
            fi
          done

      - name: part4-backplane — k6 smoke (quarkus-a, :8080)
        run: |
          docker run --rm --network host \
            -e K6_WS_URL="ws://localhost:8080/ws/v1/bookings/${BOOKING_ID}/handling-events" \
            -v "$(pwd)/examples/part4-backplane/k6:/scripts" \
            "$K6_IMAGE" run /scripts/smoke.js

      - name: part4-backplane — k6 smoke (python-a, :8081)
        run: |
          docker run --rm --network host \
            -e K6_WS_URL="ws://localhost:8081/ws/v1/bookings/${BOOKING_ID}/handling-events" \
            -v "$(pwd)/examples/part4-backplane/k6:/scripts" \
            "$K6_IMAGE" run /scripts/smoke.js

      - name: part4-backplane — docker compose down
        if: always()
        working-directory: examples/part4-backplane
        run: docker compose down -v --remove-orphans

      # ---------------------------------------------------------------
      # part5-performance — JSON-vs-Protobuf dual-encoding channel, no
      # auth gate (compose.yaml/PROTOCOL.md: Part 5 drops part4's four
      # connection concerns to isolate the encoding comparison). One
      # smoke.js run per stack already exercises BOTH subprotocols
      # (handling-events.v1+json and +protobuf) in a single iteration — see
      # that script's own header — so there is no separate +json/+protobuf
      # step pair here the way there is for part4-connection's auth steps.
      # The comparative JSON-vs-Protobuf-vs-deflate throughput benchmark
      # (k6/benchmark.js) stays LOCAL-only (DRQ-027) and is deliberately
      # NOT run here.
      # ---------------------------------------------------------------
      - name: part5-performance — docker compose up
        working-directory: examples/part5-performance
        run: docker compose up -d --build quarkus python

      - name: part5-performance — wait for both stacks to report healthy
        run: |
          set -euo pipefail
          for svc in quarkus python; do
            status=""
            for _ in $(seq 1 40); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "part5-performance-$svc" 2>/dev/null || true)"
              [ "$status" = "healthy" ] && break
              sleep 3
            done
            if [ "$status" != "healthy" ]; then
              echo "::error::part5-performance-$svc never became healthy (last status: $status)"
              docker logs "part5-performance-$svc" || true
              exit 1
            fi
          done

      - name: part5-performance — k6 smoke (quarkus, :8090, +json and +protobuf)
        run: |
          docker run --rm --network host \
            -e K6_WS_URL="ws://localhost:8090/ws/v1/bookings/${BOOKING_ID}/handling-events" \
            -v "$(pwd)/examples/part5-performance/k6:/scripts" \
            "$K6_IMAGE" run /scripts/smoke.js

      - name: part5-performance — k6 smoke (python, :8091, +json and +protobuf)
        run: |
          docker run --rm --network host \
            -e K6_WS_URL="ws://localhost:8091/ws/v1/bookings/${BOOKING_ID}/handling-events" \
            -v "$(pwd)/examples/part5-performance/k6:/scripts" \
            "$K6_IMAGE" run /scripts/smoke.js

      - name: part5-performance — docker compose down
        if: always()
        working-directory: examples/part5-performance
        run: docker compose down -v --remove-orphans
