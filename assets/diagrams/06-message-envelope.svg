<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="60" width="780" height="300" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#1d1d1d">one JSON object on the wire: components.schemas.HandlingEvent</text>
<rect x="50" y="110" width="340" height="220" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="220.0" y="195.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Envelope-like fields</text>
<text x="220.0" y="212.5" font-size="11.5" fill="#555555" text-anchor="middle">eventId: evt_ + ULID, identity</text>
<text x="220.0" y="227.5" font-size="11.5" fill="#555555" text-anchor="middle">eventType: discriminator (enum)</text>
<text x="220.0" y="242.5" font-size="11.5" fill="#555555" text-anchor="middle">occurredAt: when it happened</text>
<text x="220.0" y="257.5" font-size="11.5" fill="#555555" text-anchor="middle">registeredAt: when it was recorded</text>
<rect x="420" y="110" width="340" height="220" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="590.0" y="195.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Payload fields</text>
<text x="590.0" y="212.5" font-size="11.5" fill="#555555" text-anchor="middle">bookingId / cargoId: the subject</text>
<text x="590.0" y="227.5" font-size="11.5" fill="#555555" text-anchor="middle">location: UN/LOCODE string</text>
<text x="590.0" y="242.5" font-size="11.5" fill="#555555" text-anchor="middle">voyageNumber: optional, voyage context</text>
<text x="590.0" y="257.5" font-size="11.5" fill="#555555" text-anchor="middle">amount: optional Money (decimal string)</text>
<path d="M390,220 L420,220" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="411.0" y="214.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">same object, two roles</text>
<text x="411.0" y="214.0" font-size="11" fill="#555" text-anchor="middle">same object, two roles</text>
<text x="410" y="30" font-size="13" fill="#1d1d1d" text-anchor="middle" font-weight="700">No separate wrapper object: the contract keeps one flat message, not { envelope, payload }</text>
<text x="410" y="385" font-size="11" fill="#555555" text-anchor="middle">&quot;Envelope&quot; and &quot;payload&quot; here are roles fields play, not a nesting the JSON actually has</text>
</svg>