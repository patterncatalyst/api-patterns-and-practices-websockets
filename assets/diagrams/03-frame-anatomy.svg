<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="60" width="150" height="110" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="95.0" y="105.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Byte 0</text>
<text x="95.0" y="122.5" font-size="11.5" fill="#555555" text-anchor="middle">FIN · RSV1-3</text>
<text x="95.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">Opcode (4 bits)</text>
<rect x="190" y="60" width="150" height="110" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="265.0" y="105.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Byte 1</text>
<text x="265.0" y="122.5" font-size="11.5" fill="#555555" text-anchor="middle">MASK bit</text>
<text x="265.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">Payload len (7 bits)</text>
<rect x="360" y="60" width="150" height="110" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="435.0" y="105.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Ext. payload len</text>
<text x="435.0" y="122.5" font-size="11.5" fill="#555555" text-anchor="middle">0, 2, or 8 bytes</text>
<text x="435.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">present if len=126/127</text>
<rect x="530" y="60" width="140" height="110" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="600.0" y="105.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Masking key</text>
<text x="600.0" y="122.5" font-size="11.5" fill="#555555" text-anchor="middle">4 bytes</text>
<text x="600.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">client frames only</text>
<rect x="690" y="60" width="150" height="110" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="765.0" y="105.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Payload data</text>
<text x="765.0" y="122.5" font-size="11.5" fill="#555555" text-anchor="middle">0..N bytes</text>
<text x="765.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">XOR&#x27;d with mask key</text>
<rect x="20" y="230" width="150" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="95.0" y="260.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">0x81</text>
<text x="95.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">FIN=1, opcode=0x1</text>
<text x="95.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">(text frame)</text>
<rect x="190" y="230" width="150" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="265.0" y="268.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">0x93</text>
<text x="265.0" y="285.0" font-size="11.5" fill="#555555" text-anchor="middle">MASK=1, len=19</text>
<rect x="530" y="230" width="140" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="600.0" y="268.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">8a a4 58 27</text>
<text x="600.0" y="285.0" font-size="11.5" fill="#555555" text-anchor="middle">mask key</text>
<rect x="690" y="230" width="150" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="765.0" y="268.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">unmasks to</text>
<text x="765.0" y="285.0" font-size="11.5" fill="#555555" text-anchor="middle">{&quot;event&quot;:&quot;ARRIVED&quot;}</text>
<path d="M95,170 L95,230" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M265,170 L265,230" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M600,170 L600,230" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M765,170 L765,230" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="430" y="25" font-size="13" fill="#1d1d1d" text-anchor="middle" font-weight="700">RFC 6455 frame format — a client→server frame carrying one handling-event message</text>
<text x="430" y="345" font-size="12" fill="#b8650a" text-anchor="middle" font-weight="700">Real capture: 81 93 8a a4 58 27 f1 86 3d 51 ef ca 2c 05 b0 86 19 75 d8 ed 0e 62 ce 86 25</text>
<text x="430" y="365" font-size="11" fill="#555555" text-anchor="middle">No extended length field here: 19 fits in the 7-bit payload-length field, so that box is unused.</text>
</svg>