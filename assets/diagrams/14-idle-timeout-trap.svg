<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="20" width="920" height="220" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">BROKEN — auto-ping-interval + quarkus.http.idle-timeout alone</text>
<rect x="20" y="270" width="920" height="230" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="290" font-size="12" font-weight="700" fill="#1d1d1d">WORKS — HandlingEventConnectionWebSocket + HeartbeatLivenessSweep</text>
<rect x="50" y="70" width="190" height="75" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="145.0" y="98.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">SILENT PEER</text>
<text x="145.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">upgrade completes,</text>
<text x="145.0" y="130.0" font-size="11.5" fill="#555555" text-anchor="middle">then never answers a ping</text>
<rect x="320" y="70" width="210" height="75" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="425.0" y="98.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">SERVER auto-ping</text>
<text x="425.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">sends PING every</text>
<text x="425.0" y="130.0" font-size="11.5" fill="#555555" text-anchor="middle">auto-ping-interval (20s)</text>
<rect x="610" y="70" width="300" height="75" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="760.0" y="98.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">idle-timeout clock</text>
<text x="760.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">resets on this WRITE —</text>
<text x="760.0" y="130.0" font-size="11.5" fill="#555555" text-anchor="middle">read OR write both count</text>
<rect x="610" y="170" width="300" height="55" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="760.0" y="195.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">40s idle-timeout never expires —</text>
<text x="760.0" y="212.5" font-size="11.5" fill="#555555" text-anchor="middle">connection looks healthy forever</text>
<rect x="50" y="320" width="190" height="75" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="145.0" y="348.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">SILENT PEER</text>
<text x="145.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">same peer,</text>
<text x="145.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">never pongs</text>
<rect x="320" y="320" width="230" height="75" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="435.0" y="348.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">LAST_PONG_AT</text>
<text x="435.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">stamped on open, never</text>
<text x="435.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">updated again — stays stale</text>
<rect x="620" y="320" width="290" height="75" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="765.0" y="348.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">HeartbeatLivenessSweep</text>
<text x="765.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">ticks every sweep-interval (5s),</text>
<text x="765.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">compares now - LAST_PONG_AT</text>
<rect x="620" y="420" width="290" height="60" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="765.0" y="448.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">&gt;livenessTimeout (45s) —</text>
<text x="765.0" y="465.0" font-size="11.5" fill="#555555" text-anchor="middle">close(4408) requested</text>
<path d="M240,107 L320,107" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="286.0" y="101.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">stays silent</text>
<text x="286.0" y="101.0" font-size="11" fill="#555" text-anchor="middle">stays silent</text>
<path d="M530,107 L610,107" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="576.0" y="101.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">write activity</text>
<text x="576.0" y="101.0" font-size="11" fill="#555" text-anchor="middle">write activity</text>
<path d="M760,145 L760,170" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="766.0" y="151.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">clock reset, again and again</text>
<text x="766.0" y="151.5" font-size="11" fill="#b8650a" text-anchor="middle">clock reset, again and again</text>
<path d="M240,357 L320,357" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="286.0" y="351.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">never pongs</text>
<text x="286.0" y="351.0" font-size="11" fill="#555" text-anchor="middle">never pongs</text>
<path d="M550,357 L620,357" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="591.0" y="351.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">sweep reads userData()</text>
<text x="591.0" y="351.0" font-size="11" fill="#555" text-anchor="middle">sweep reads userData()</text>
<path d="M765,395 L765,420" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="771.0" y="401.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">silentFor &gt; timeout</text>
<text x="771.0" y="401.5" font-size="11" fill="#b8650a" text-anchor="middle">silentFor &gt; timeout</text>
<text x="480" y="500" font-size="12" fill="#b8650a" text-anchor="middle" font-weight="700">idle-timeout resets on the server&#x27;s OWN outbound ping — a silent peer never trips it. Only an explicit pong-tracked sweep does.</text>
</svg>