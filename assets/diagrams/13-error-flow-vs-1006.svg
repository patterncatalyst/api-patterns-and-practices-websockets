<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="20" width="460" height="420" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">Protocol error — verify.sh Ch13 step, both stacks</text>
<rect x="510" y="20" width="470" height="420" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="522" y="40" font-size="12" font-weight="700" fill="#1d1d1d">Peer disappears — no close handshake at all</text>
<rect x="50" y="60" width="400" height="55" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="250.0" y="85.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client sends a client-to-server frame</text>
<text x="250.0" y="102.5" font-size="11.5" fill="#555555" text-anchor="middle">(channel defines none — any frame is invalid)</text>
<rect x="50" y="150" width="400" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="250.0" y="178.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Server: onTextMessage / _receive_loop</text>
<text x="250.0" y="195.0" font-size="11.5" fill="#555555" text-anchor="middle">classifies WHY (not JSON, not object, ...)</text>
<rect x="50" y="245" width="400" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="250.0" y="270.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">sendText(ErrorEnvelope.badRequest(...))</text>
<text x="250.0" y="287.5" font-size="11.5" fill="#555555" text-anchor="middle">{&quot;error&quot;:{&quot;code&quot;:&quot;BAD_REQUEST&quot;, ...}}</text>
<rect x="50" y="335" width="400" height="85" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="250.0" y="368.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">connection.close(BAD_REQUEST, ...)</text>
<text x="250.0" y="385.0" font-size="11.5" fill="#555555" text-anchor="middle">client onmessage fires FIRST (envelope),</text>
<text x="250.0" y="400.0" font-size="11.5" fill="#555555" text-anchor="middle">then onclose fires with code=4400</text>
<rect x="540" y="60" width="400" height="55" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="740.0" y="85.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Process killed / network partition /</text>
<text x="740.0" y="102.5" font-size="11.5" fill="#555555" text-anchor="middle">cable pulled — no FIN, no close frame</text>
<rect x="540" y="150" width="400" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="740.0" y="178.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">No ErrorEnvelope possible — the server</text>
<text x="740.0" y="195.0" font-size="11.5" fill="#555555" text-anchor="middle">never got a chance to send one</text>
<rect x="540" y="245" width="400" height="60" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="740.0" y="273.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Peer&#x27;s TCP stack eventually gives up</text>
<text x="740.0" y="290.0" font-size="11.5" fill="#555555" text-anchor="middle">(timeout) or never notices at all</text>
<rect x="540" y="335" width="400" height="85" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="740.0" y="368.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client runtime SYNTHESIZES onclose</text>
<text x="740.0" y="385.0" font-size="11.5" fill="#555555" text-anchor="middle">code=1006 &quot;abnormal closure&quot; locally —</text>
<text x="740.0" y="400.0" font-size="11.5" fill="#555555" text-anchor="middle">never sent on the wire by either peer</text>
<path d="M250,115 L250,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M250,210 L250,245" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M250,300 L250,335" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M740,115 L740,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M740,210 L740,245" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M740,305 L740,335" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="500" y="445" font-size="12" fill="#555555" text-anchor="middle">1006 is a reserved RFC 6455 value an implementation must never put in an actual close frame — it exists only for a local API to report &quot;the connection ended with no handshake.&quot;</text>
</svg>