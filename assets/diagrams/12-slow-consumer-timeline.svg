<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="20" width="940" height="400" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">Time flows left to right — the client&#x27;s TCP receive window fills, then the server&#x27;s own buffer fills behind it</text>
<rect x="50" y="70" width="190" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="145.0" y="103.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">t0: connection opens</text>
<text x="145.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">buffer empty, client draining</text>
<rect x="280" y="70" width="190" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="375.0" y="103.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">t1: client slows down</text>
<text x="375.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">TCP receive window fills</text>
<rect x="510" y="70" width="190" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="605.0" y="95.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">t2: sendText/send()</text>
<text x="605.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">stays pending — socket</text>
<text x="605.0" y="127.5" font-size="11.5" fill="#555555" text-anchor="middle">write itself blocks</text>
<rect x="740" y="70" width="200" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="840.0" y="95.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">t3: buffer fills OR</text>
<text x="840.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">send() exceeds timeout</text>
<text x="840.0" y="127.5" font-size="11.5" fill="#555555" text-anchor="middle">— policy trips</text>
<rect x="740" y="220" width="200" height="80" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="840.0" y="250.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">t4 (CLOSE): 4290</text>
<text x="840.0" y="267.5" font-size="11.5" fill="#555555" text-anchor="middle">SLOW_CONSUMER —</text>
<text x="840.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">remaining events dropped</text>
<rect x="480" y="220" width="200" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="580.0" y="250.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">t4 (DROP): this event</text>
<text x="580.0" y="267.5" font-size="11.5" fill="#555555" text-anchor="middle">discarded, buffer keeps</text>
<text x="580.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">accepting new ones</text>
<path d="M240,105 L280,105" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="266.0" y="99.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">producer keeps enqueueing</text>
<text x="266.0" y="99.0" font-size="11" fill="#555" text-anchor="middle">producer keeps enqueueing</text>
<path d="M470,105 L510,105" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="496.0" y="99.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">pending += 1</text>
<text x="496.0" y="99.0" font-size="11" fill="#555" text-anchor="middle">pending += 1</text>
<path d="M700,105 L740,105" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="726.0" y="99.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">threshold crossed</text>
<text x="726.0" y="99.0" font-size="11" fill="#555" text-anchor="middle">threshold crossed</text>
<path d="M840,140 L840,220" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="846.0" y="174.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">policy = CLOSE</text>
<text x="846.0" y="174.0" font-size="11" fill="#b8650a" text-anchor="middle">policy = CLOSE</text>
<path d="M790,140 L580,220" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="691.0" y="174.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">policy = DROP</text>
<text x="691.0" y="174.0" font-size="11" fill="#555" text-anchor="middle">policy = DROP</text>
<text x="490" y="400" font-size="12" fill="#555555" text-anchor="middle">Without a bound, this same timeline just keeps t1-t3 going forever: the buffer grows without limit and the server&#x27;s own memory is what eventually fails, not the client.</text>
</svg>