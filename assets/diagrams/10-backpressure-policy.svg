<text x="636.0" y="196.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">dequeue / take</text>
<text x="636.0" y="196.0" font-size="11" fill="#555" text-anchor="middle">dequeue / take</text>
<path d="M440,245 L235,300" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
