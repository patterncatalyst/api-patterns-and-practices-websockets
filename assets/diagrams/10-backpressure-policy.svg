<text x="343.5" y="266.5" font-size="11" fill="#555" text-anchor="middle">queue full?</text>
<path d="M470,245 L625,300" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="553.5" y="266.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">queue full?</text>
<text x="553.5" y="266.5" font-size="11" fill="#555" text-anchor="middle">queue full?</text>
<path d="M160,300 L155,245" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="163.5" y="266.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">blocks producer coroutine/thread</text>
<text x="163.5" y="266.5" font-size="11" fill="#b8650a" text-anchor="middle">blocks producer coroutine/thread</text>
<path d="M625,300 L480,245" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="558.5" y="266.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">evict + enqueue newest</text>
<text x="558.5" y="266.5" font-size="11" fill="#b8650a" text-anchor="middle">evict + enqueue newest</text>
<text x="470" y="400" font-size="12" fill="#555555" text-anchor="middle">Neither policy is &quot;correct&quot; in the abstract — it is a per-integration trade-off exposed as CLIENT_BUFFER_POLICY / client.buffer.policy, not hardcoded.</text>
</svg>