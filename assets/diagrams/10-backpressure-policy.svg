<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="20" width="900" height="380" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">EventBuffer.java / asyncio.Queue in client.py — decouples socket read rate from consumer rate</text>
<rect x="50" y="160" width="210" height="85" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="155.0" y="193.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">WebSocket read loop</text>
<text x="155.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">onMessage() / async for</text>
<text x="155.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">message in ws</text>
<rect x="360" y="160" width="220" height="85" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="470.0" y="193.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">BOUNDED QUEUE</text>
<text x="470.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">capacity = CLIENT_BUFFER_CAPACITY</text>
<text x="470.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">(default 16)</text>
<rect x="680" y="160" width="210" height="85" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="785.0" y="193.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Consumer task/thread</text>
<text x="785.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">process(message)</text>
<text x="785.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">consumer.delay-ms sleep</text>
<rect x="90" y="300" width="290" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="235.0" y="325.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">BLOCK (default)</text>
<text x="235.0" y="342.5" font-size="11.5" fill="#555555" text-anchor="middle">queue.put() awaits room —</text>
<text x="235.0" y="357.5" font-size="11.5" fill="#555555" text-anchor="middle">no frame lost, producer throttles</text>
<rect x="480" y="300" width="290" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="625.0" y="325.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">DROP_OLDEST</text>
<text x="625.0" y="342.5" font-size="11.5" fill="#555555" text-anchor="middle">evict oldest, log warning,</text>
<text x="625.0" y="357.5" font-size="11.5" fill="#555555" text-anchor="middle">enqueue newest — never blocks</text>
<path d="M260,202 L360,202" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="316.0" y="196.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">enqueue / offer</text>
<text x="316.0" y="196.0" font-size="11" fill="#555" text-anchor="middle">enqueue / offer</text>
