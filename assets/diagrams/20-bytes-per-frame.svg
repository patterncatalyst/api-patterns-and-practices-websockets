<text x="598.5" y="69.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">compression: &quot;deflate&quot;</text>
<text x="598.5" y="69.0" font-size="11" fill="#b8650a" text-anchor="middle">compression: &quot;deflate&quot;</text>
