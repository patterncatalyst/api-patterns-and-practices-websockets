<path d="M235,380 L400,405" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M665,380 L500,405" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="450" y="470" font-size="11" fill="#555555" text-anchor="middle">Bytes/frame numbers are the fixture&#x27;s size, not a function of load: the only row that changes with load is connects/sec.</text>
