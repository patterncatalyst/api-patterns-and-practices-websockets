<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="20" width="940" height="480" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">CloseCodes.java / ws_server.py docstring — one decision, applied per failure</text>
<rect x="350" y="55" width="280" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="490.0" y="88.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Something went wrong</text>
<text x="490.0" y="105.0" font-size="11.5" fill="#555555" text-anchor="middle">on this connection</text>
<rect x="330" y="165" width="320" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="490.0" y="200.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Is there ONE specific offending</text>
<text x="490.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">frame to annotate, and is the</text>
<text x="490.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">socket still open to send on?</text>
<rect x="60" y="310" width="320" height="110" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="220.0" y="355.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">YES — e.g. a malformed client frame</text>
<text x="220.0" y="372.5" font-size="11.5" fill="#555555" text-anchor="middle">1. send ErrorEnvelope (still open)</text>
<text x="220.0" y="387.5" font-size="11.5" fill="#555555" text-anchor="middle">2. THEN close(BAD_REQUEST / 4400)</text>
<rect x="600" y="300" width="340" height="150" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="770.0" y="350.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">NO — no single frame to blame,</text>
<text x="770.0" y="367.5" font-size="11.5" fill="#555555" text-anchor="middle">or the socket is already gone</text>
<text x="770.0" y="382.5" font-size="11.5" fill="#555555" text-anchor="middle">close code ALONE is the signal:</text>
<text x="770.0" y="397.5" font-size="11.5" fill="#555555" text-anchor="middle">AUTH_FAILURE 1008 · SLOW_CONSUMER 4290</text>
<text x="770.0" y="412.5" font-size="11.5" fill="#555555" text-anchor="middle">LIVENESS_TIMEOUT 4408 · UNEXPECTED 1011</text>
<rect x="60" y="460" width="320" height="40" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="220.0" y="485.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">client&#x27;s normal message handler sees WHY</text>
<path d="M490,125 L490,165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M400,255 L260,310" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="336.0" y="276.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">yes</text>
<text x="336.0" y="276.5" font-size="11" fill="#555" text-anchor="middle">yes</text>
<path d="M580,255 L740,300" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="666.0" y="271.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">no</text>
<text x="666.0" y="271.5" font-size="11" fill="#555" text-anchor="middle">no</text>
<path d="M220,420 L220,460" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="490" y="500" font-size="12" fill="#b8650a" text-anchor="middle" font-weight="700">A close code alone arrives as the socket is going away — too late to carry detail. The envelope is sent FIRST, while the connection is still open.</text>
</svg>