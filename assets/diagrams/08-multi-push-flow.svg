<text x="256.0" y="79.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">upgrade</text>
<text x="256.0" y="79.0" font-size="11" fill="#555" text-anchor="middle">upgrade</text>
<path d="M510,85 L580,85" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="551.0" y="79.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">subscribe</text>
<text x="551.0" y="79.0" font-size="11" fill="#555" text-anchor="middle">subscribe</text>
