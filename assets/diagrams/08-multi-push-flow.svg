<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="30" y="50" width="190" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="125.0" y="75.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
<text x="125.0" y="92.5" font-size="11.5" fill="#555555" text-anchor="middle">opens WebSocket</text>
<text x="125.0" y="107.5" font-size="11.5" fill="#555555" text-anchor="middle">to /ws/v1/bookings/{id}/...</text>
<rect x="280" y="50" width="230" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="395.0" y="75.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">@OnOpen onOpen()</text>
<text x="395.0" y="92.5" font-size="11.5" fill="#555555" text-anchor="middle">returns</text>
<text x="395.0" y="107.5" font-size="11.5" fill="#555555" text-anchor="middle">Multi.createFrom().iterable(feed.events())</text>
<rect x="580" y="50" width="250" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="705.0" y="75.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">WebSockets Next runtime</text>
<text x="705.0" y="92.5" font-size="11.5" fill="#555555" text-anchor="middle">subscribes to the Multi,</text>
<text x="705.0" y="107.5" font-size="11.5" fill="#555555" text-anchor="middle">drives emission onto the connection</text>
<rect x="280" y="180" width="150" height="50" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="355.0" y="203.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">RECEIVE</text>
<text x="355.0" y="220.0" font-size="11.5" fill="#555555" text-anchor="middle">USNYC</text>
<rect x="450" y="180" width="150" height="50" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="525.0" y="203.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">LOAD</text>
<text x="525.0" y="220.0" font-size="11.5" fill="#555555" text-anchor="middle">USNYC</text>
<rect x="620" y="180" width="150" height="50" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="695.0" y="203.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">CUSTOMS</text>
<text x="695.0" y="220.0" font-size="11.5" fill="#555555" text-anchor="middle">NLRTM</text>
<rect x="30" y="280" width="230" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="145.0" y="305.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
<text x="145.0" y="322.5" font-size="11.5" fill="#555555" text-anchor="middle">receives 3 text frames,</text>
<text x="145.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">in fixture order</text>
<rect x="580" y="280" width="250" height="70" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="705.0" y="305.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Multi completes</text>
<text x="705.0" y="322.5" font-size="11.5" fill="#555555" text-anchor="middle">after the 3rd item</text>
<text x="705.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">connection stays open</text>
