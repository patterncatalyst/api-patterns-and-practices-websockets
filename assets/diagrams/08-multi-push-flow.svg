<text x="361.0" y="144.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">item 1</text>
<text x="361.0" y="144.0" font-size="11" fill="#b8650a" text-anchor="middle">item 1</text>
<path d="M525,120 L525,180" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="531.0" y="144.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">item 2</text>
<text x="531.0" y="144.0" font-size="11" fill="#b8650a" text-anchor="middle">item 2</text>
<path d="M695,120 L695,180" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="701.0" y="144.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">item 3</text>
<text x="701.0" y="144.0" font-size="11" fill="#b8650a" text-anchor="middle">item 3</text>
<path d="M355,230 L145,280" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="256.0" y="249.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">text frame</text>
<text x="256.0" y="249.0" font-size="11" fill="#555" text-anchor="middle">text frame</text>
<path d="M525,230 L180,280" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M695,230 L695,280" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="701.0" y="249.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">onComplete</text>
<text x="701.0" y="249.0" font-size="11" fill="#555" text-anchor="middle">onComplete</text>
<text x="430" y="25" font-size="13" fill="#1d1d1d" text-anchor="middle" font-weight="700">Each Multi item becomes one JSON text frame, sent in emission order, over the one connection @OnOpen returned it for</text>
<text x="430" y="365" font-size="11" fill="#555555" text-anchor="middle">Nothing closes the socket when the Multi completes: only the TCP/WebSocket close (not shown) ends the connection</text>
</svg>