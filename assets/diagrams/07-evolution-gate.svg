<text x="410" y="30" font-size="13" fill="#1d1d1d" text-anchor="middle" font-weight="700">Classifying a change to the handling-event contract</text>
<text x="20" y="55" font-size="12" fill="#b8650a" text-anchor="start" font-weight="700">SAFE — an old client&#x27;s deserializer never has to look at the new part</text>
<text x="20" y="245" font-size="12" fill="#555555" text-anchor="start" font-weight="700">BREAKING — an old client misreads bytes it already expected to understand</text>
<text x="410" y="400" font-size="11" fill="#555555" text-anchor="middle">Each dashed line pairs the same kind of change: safe addition above, breaking mutation of the same thing below.</text>
