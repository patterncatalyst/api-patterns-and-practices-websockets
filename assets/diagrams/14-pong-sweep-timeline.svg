<rect x="920" y="190" width="220" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1030.0" y="215.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">T+~55s</text>
<text x="1030.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">TCP forced closed;</text>
<text x="1030.0" y="247.5" font-size="11.5" fill="#555555" text-anchor="middle">onClose sees code 1006</text>
