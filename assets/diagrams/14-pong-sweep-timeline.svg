<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="20" width="1140" height="300" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">Default config: auto-ping-interval=20s, liveness-timeout=45s, sweep-interval=5s, Vert.x closing grace=~10s</text>
<rect x="50" y="70" width="170" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
