<text x="315.0" y="84.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">upgrade</text>
<text x="315.0" y="84.0" font-size="11" fill="#555" text-anchor="middle">upgrade</text>
<path d="M540,70 L720,110" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="660.0" y="84.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">upgrade</text>
<text x="660.0" y="84.0" font-size="11" fill="#555" text-anchor="middle">upgrade</text>
