<path d="M720,275 L540,320" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M480,375 L480,420" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="486.0" y="391.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">OTLP</text>
<text x="486.0" y="391.5" font-size="11" fill="#b8650a" text-anchor="middle">OTLP</text>
<path d="M300,530 L260,565" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M660,530 L700,565" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="490" y="605" font-size="12" fill="#555555" text-anchor="middle">Same trace-id-in-logs shape on both stacks correlates a log line to the trace Tempo eventually ingests.</text>
