<text x="482" y="60" font-size="12" font-weight="700" fill="#1d1d1d">Protobuf (handling-event.proto)</text>
<rect x="45" y="70" width="360" height="30" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="225.0" y="90.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">&quot;eventId&quot;: &lt;value&gt;  — key literal sent every frame</text>
