[project]
name = "backplane-python"
version = "1.0.0"
description = "Part 4 example — Python native-websockets handling-events feed with reconnect (Ch15/Ch16 afterEventId resume) and scale-out fan-out over a shared backplane (Ch18, DRQ-005): stateless (default)/kafka/redis. Forks examples/part4-connection/python (FastAPI for HTTP/app lifecycle, the websockets library drives the WS connection); see examples/part4-backplane/PROTOCOL.md for the shared wire/behavior contract with the Quarkus sibling."
requires-python = ">=3.15"
dependencies = [
    "aiokafka>=0.14.0",
    "fastapi>=0.146.0",
    "opentelemetry-distro>=0.66b1",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]
