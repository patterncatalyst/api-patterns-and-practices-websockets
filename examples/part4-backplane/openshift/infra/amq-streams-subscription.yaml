# AMQ Streams (Red Hat's build of Strimzi) — the Kafka operator for
# part4-backplane's Kafka backplane mode (Ch16 replay + Ch18 fan-out) on
# OpenShift Local. Installed into openshift-operators, which already exists
# on a fresh CRC instance and carries the default "global-operators"
# OperatorGroup, so no separate Namespace/OperatorGroup is needed here (see
# ../lib.sh's install_operator and ../../../../../.claude skill's
# references/operators.md for the pinning pattern this follows).
#
# installPlanApproval: Manual + startingCSV pins the exact version: OLM
# proposes only this CSV's InstallPlan, and install_operator (../lib.sh)
# approves only the InstallPlan naming it. A later InstallPlan (an upgrade
# OLM proposes on its own) stays unapproved until this file is deliberately
# bumped.
#
# ---------------------------------------------------------------------------
# PIN STATUS: DATED DRAFT — channel/CSV below were last directly confirmed
# 2026-10-09 (the lgtm-crc skill's live CRC survey, references/versions.md),
# NOT surveyed against this specific OpenShift Local instance or on the date
# this appendix was scaffolded (2026-10-19).
#
# That channel (amq-streams-3.2.x) is KNOWN, from the SAME 2026-10-09 survey
# (see the skill's infra/kafka.yaml comment and references/versions.md's
# Operands table), to ship Kafka 4.1.x/4.2.x ONLY. ../infra/kafka.yaml in
# THIS directory pins Kafka 4.3.1 (to match compose.yaml's apache/kafka:4.3.1
# and the minikube/Strimzi-1.3.0 path at ../../k8s/strimzi/kafka.yaml) — that
# version is NOT confirmed to be one this CSV's AMQ Streams build supports.
#
# TODO(pin survey D0): before the first live CRC run, re-survey on the actual
# cluster and pick the newest stable channel/CSV that ships a Kafka 4.3.x
# line (or step kafka.yaml's version back to match whatever this channel
# supports — check with `oc get csv <csv> -n openshift-operators -o yaml`
# once installed, or AMQ Streams' own release notes for the channel):
#
#   oc get packagemanifest amq-streams -n openshift-marketplace \
#     -o jsonpath='{range .status.channels[*]}{.name}  {.currentCSV}{"\n"}{end}'
#
# Update THIS file's channel/startingCSV, ../install-infra.sh's CSV variable,
# AND ../infra/kafka.yaml's spec.kafka.version/metadataVersion together —
# never let the three drift out of step with each other.
# ---------------------------------------------------------------------------
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: amq-streams
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: part4-backplane
spec:
  name: amq-streams
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  channel: amq-streams-3.2.x
  startingCSV: amqstreams.v3.2.1-14
  installPlanApproval: Manual
