# Part 4 "Production Concerns" backplane example — Quarkus HandlingEvent
# WebSocket feed with three interchangeable delivery modes (stateless /
# kafka / redis). See examples/part4-backplane/PROTOCOL.md for the full
# wire/behavior contract shared with the Python sibling app.

# HTTP (and WebSocket upgrade) port. Bound to 0.0.0.0 for container use;
# quarkus:dev keeps localhost. Override with QUARKUS_HTTP_PORT (standard
# Quarkus env mapping) — this is how the second compose instance (quarkus-b,
# 8083) differs from this one without touching this file.
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Which stack identity logs every connection accept and every delivery
# (PROTOCOL.md's "Instance identity" section:
# `delivered eventId=<id> bookingId=<id> instance=<INSTANCE_ID>`). Override
# with INSTANCE_ID — each compose service sets its own (quarkus-a, quarkus-b).
instance.id=${INSTANCE_ID:quarkus}

# ── Backplane mode selection (PROTOCOL.md's "Backplane modes" section) ──
# stateless (default) | kafka | redis. See BackplaneRouter/BackplaneMode.
backplane.mode=${BACKPLANE_MODE:stateless}

# ── Kafka backplane mode (Ch16 resume + Ch18 fan-out) ───────────────────
# Always wired (quarkus-messaging-kafka's @Incoming/@Outgoing annotations are
# static, not conditional on backplane.mode) — harmless when stateless/redis
# mode is active and nothing publishes to this topic; see KafkaBackplane's
# and BackplaneRouter's Javadoc. Devservices disabled below so `./mvnw test`
# and a stateless-mode boot never require Docker/a reachable broker.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false

mp.messaging.outgoing.handling-events-out.connector=smallrye-kafka
mp.messaging.outgoing.handling-events-out.topic=handling-events
mp.messaging.outgoing.handling-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.handling-events-out.value.serializer=com.patterncatalyst.shipping.backplane.HandlingEventSerializer

mp.messaging.incoming.handling-events-in.connector=smallrye-kafka
mp.messaging.incoming.handling-events-in.topic=handling-events
mp.messaging.incoming.handling-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.handling-events-in.value.deserializer=com.patterncatalyst.shipping.backplane.HandlingEventDeserializer
# Distinct consumer group PER INSTANCE (not shared) — see KafkaBackplane's
# Javadoc for why this must be fan-out, not load-balanced.
mp.messaging.incoming.handling-events-in.group.id=${INSTANCE_ID:quarkus}-handling-events
# Replay the whole topic (within retention) on a fresh instance start, so
# afterEventId resume has full history to filter against, not just events
# seen since this instance's own uptime began.
mp.messaging.incoming.handling-events-in.auto.offset.reset=earliest
mp.messaging.incoming.handling-events-in.enable.auto.commit=false

# ── Redis backplane mode (Ch18 fan-out, no replay) ──────────────────────
# Also always wired (RedisDataSource connects lazily on first command, so
# this is harmless when a different mode is active and no broker is
# reachable — unlike the Kafka connector's eager channel creation, nothing
# here runs until RedisBackplane is actually invoked by BackplaneRouter).
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.devservices.enabled=false

# OTel is wired (quarkus-opentelemetry) but the SDK is disabled by default —
# same convention as part3/part4-connection.
quarkus.otel.sdk.disabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=part4-backplane-quarkus
