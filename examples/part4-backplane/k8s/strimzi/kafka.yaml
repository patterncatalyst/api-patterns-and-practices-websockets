# Strimzi-managed Kafka for the minikube deploy — applied by
# ../scripts/install-strimzi.sh AFTER the Strimzi cluster operator (Helm
# chart, see that script) is Available, so its CRDs
# (kafkas.kafka.strimzi.io, kafkanodepools.kafka.strimzi.io) already exist.
#
# Single-node KRaft (controller+broker combined — "dual-role"), ephemeral
# storage (emptyDir-backed, no PersistentVolumeClaim/StorageClass needed —
# fine for a throwaway minikube example; never use `type: ephemeral` for
# anything meant to survive a pod restart). Strimzi 1.x serves ONLY the v1
# CRD API (`kafka.strimzi.io/v1` — v1beta2/v1beta1/v1alpha1 are gone and an
# old CR is rejected).
#
# Kafka version 4.3.1 / metadataVersion 4.3-IV0 matches Strimzi 1.3.0's own
# default (confirmed against its kafka-versions.yaml) and compose.yaml's
# `apache/kafka:4.3.1` pin for this same example, so the resume/fan-out
# behavior Ch16/Ch18 exercise is running the identical Kafka release in both
# environments.
#
# Replication factors are 1 (single broker, no redundancy) — this is a demo
# cluster for proving the WIRE behavior (replay, fan-out), not a durability
# exercise.
#
# Bootstrap Service Strimzi creates: `my-cluster-kafka-bootstrap` (this CR's
# `metadata.name` + `-kafka-bootstrap`), reachable in-namespace on port 9092
# (the `plain`, non-TLS internal listener) — see base/configmap.yaml's
# KAFKA_BOOTSTRAP_SERVERS.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: part4-backplane
  labels:
    strimzi.io/cluster: my-cluster
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: ephemeral
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-cluster
  namespace: part4-backplane
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
