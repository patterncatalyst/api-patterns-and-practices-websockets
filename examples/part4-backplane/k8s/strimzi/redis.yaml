# Redis backplane (PROTOCOL.md's redis mode, no replay — the Ch18 contrast
# with Kafka). Plain Deployment+Service, not an operator-managed resource
# (there is no equivalent operator in play here the way Strimzi manages
# Kafka) — a single pod is enough to prove live-only cross-instance fan-out.
# Pin matches compose.yaml's `redis:8.10.2-alpine` exactly, so the redis leg
# of Ch18 runs the identical Redis release in both environments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: part4-backplane
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: part4-backplane
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
