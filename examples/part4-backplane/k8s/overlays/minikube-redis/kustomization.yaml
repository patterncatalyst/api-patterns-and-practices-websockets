# Same minikube deploy as ../minikube, with the redis-mode component layered
# on top so BACKPLANE_MODE=redis instead of kafka (PROTOCOL.md's Ch18 redis
# fan-out scenario, no replay). verify-minikube.sh uses ../minikube by
# default and switches to this overlay only for the redis leg of the Ch18
# proof.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../minikube

components:
  - ../../components/redis-mode
