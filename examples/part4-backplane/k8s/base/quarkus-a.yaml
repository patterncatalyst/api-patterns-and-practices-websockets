# Instance A of the Quarkus WebSockets Next stack. This is the instance the
# Ingress (ingress.yaml) routes external traffic to — verify-minikube.sh
# connects through the Ingress to THIS instance, then injects events via
# quarkus-b's in-cluster Service (never through the Ingress — PROTOCOL.md's
# inject endpoint is internal/demo-only, not part of the public contract).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-a
  namespace: part4-backplane
  labels:
    app.kubernetes.io/name: quarkus-a
    app.kubernetes.io/part-of: part4-backplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quarkus-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quarkus-a
        app.kubernetes.io/part-of: part4-backplane
    spec:
      containers:
        - name: quarkus
          # Retagged to :minikube and set to imagePullPolicy: Never by
          # overlays/minikube (see that kustomization.yaml) — this base name
          # is a placeholder, never pulled from a registry.
          image: part4-backplane-quarkus:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backplane-config
          env:
            - name: INSTANCE_ID
              value: "quarkus-a"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # No dedicated health endpoint on this chapter's example (same as
          # compose.yaml's healthcheck note) — a TCP probe on the HTTP port
          # is the httpGet-free equivalent of compose's
          # `curl -s -o /dev/null http://127.0.0.1:8080/`, which deliberately
          # ignores the response status code (plain GET / gets a 404/426).
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: quarkus-a
  namespace: part4-backplane
  labels:
    app.kubernetes.io/name: quarkus-a
    app.kubernetes.io/part-of: part4-backplane
spec:
  selector:
    app.kubernetes.io/name: quarkus-a
  ports:
    - name: http
      port: 8080
      targetPort: 8080
