# Instance A of the Python (native `websockets` + FastAPI) stack. The
# Ingress routes external WS traffic to this instance's `ws` port (8081);
# `http` (8082) carries /healthz and the inject endpoint but is never
# Ingress-routed (same "A is the externally reachable one" split as
# quarkus-a/b).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-a
  namespace: part4-backplane
  labels:
    app.kubernetes.io/name: python-a
    app.kubernetes.io/part-of: part4-backplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-a
        app.kubernetes.io/part-of: part4-backplane
    spec:
      containers:
        - name: python
          image: part4-backplane-python:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: ws
              containerPort: 8081
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: backplane-config
          env:
            - name: INSTANCE_ID
              value: "python-a"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: python-a
  namespace: part4-backplane
  labels:
    app.kubernetes.io/name: python-a
    app.kubernetes.io/part-of: part4-backplane
spec:
  selector:
    app.kubernetes.io/name: python-a
  ports:
    - name: ws
      port: 8081
      targetPort: 8081
    - name: http
      port: 8082
      targetPort: 8082
