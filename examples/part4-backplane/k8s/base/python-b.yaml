# Instance B of the Python stack. Not Ingress-routed — verify-minikube.sh's
# cross-pod fan-out proof injects through THIS instance's in-cluster Service
# (`python-b:8082`, the http port) via `kubectl exec` curl, and asserts the
# frame shows up on a client connected to python-a instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-b
  namespace: part4-backplane
  labels:
    app.kubernetes.io/name: python-b
    app.kubernetes.io/part-of: part4-backplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python-b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-b
        app.kubernetes.io/part-of: part4-backplane
    spec:
      containers:
        - name: python
          image: part4-backplane-python:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: ws
              containerPort: 8081
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: backplane-config
          env:
            - name: INSTANCE_ID
              value: "python-b"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: python-b
  namespace: part4-backplane
  labels:
    app.kubernetes.io/name: python-b
    app.kubernetes.io/part-of: part4-backplane
spec:
  selector:
    app.kubernetes.io/name: python-b
  ports:
    - name: ws
      port: 8081
      targetPort: 8081
    - name: http
      port: 8082
      targetPort: 8082
