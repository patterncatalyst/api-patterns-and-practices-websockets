[project]
name = "observability-python"
version = "1.0.0"
description = "Part 6 example — Python native-websockets handling-events feed with live OpenTelemetry traces + metrics into LGTM (Ch23). Forks examples/part3-handling-events/python's layout (FastAPI for HTTP/app lifecycle, the websockets library drives the WS connection); the manual-span finding (DRQ-028) is the point of this example — native `websockets` has no OTel auto-instrumentation, so app/ws_server.py starts the `ws.handling-events.connection` span by hand."
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.148.0",
    "opentelemetry-distro>=0.66b1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "prometheus-client>=0.26.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]
