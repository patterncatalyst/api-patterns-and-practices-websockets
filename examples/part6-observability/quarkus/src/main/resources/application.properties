# Part 6 "Observability" example — Quarkus HandlingEvent WebSocket feed,
# instrumented with LIVE OpenTelemetry traces (OTLP export to the `lgtm`
# compose service) and Micrometer/Prometheus metrics (DRQ-028/DRQ-029). See
# HandlingEventObservabilityWebSocket for the span/log-line/counter wiring
# and README.md for the exact conventions shared with the Python sibling.

# HTTP (and WebSocket upgrade) port. Bound to 0.0.0.0 in the container image
# and under compose; defaults to localhost for `quarkus:dev`.
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# ── Traces: OTel SDK is ENABLED (unlike part3/part4, where it is wired but
# inert) — this chapter's whole point is a live export, not a dormant one. ──
quarkus.otel.sdk.disabled=false
# Falls back to the OTel SDK's own default (http://localhost:4317 — gRPC)
# when OTEL_EXPORTER_OTLP_ENDPOINT is unset, which simply fails to export
# (logged, non-fatal) when no collector is listening; the app still serves
# the WebSocket either way. compose.yaml sets this to http://lgtm:4317.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=part6-observability-quarkus

# ── Metrics (DRQ-029): quarkus-micrometer-registry-prometheus publishes
# /q/metrics by default — no extra config needed for the scrape path itself.
# handling_events_delivered_total is registered programmatically in
# HandlingEventObservabilityWebSocket. ──
