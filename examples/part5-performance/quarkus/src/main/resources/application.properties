# Part 5 "Performance" example — Quarkus HandlingEvent WebSocket feed with a
# choice of two wire encodings (JSON text vs. Protobuf binary), negotiated
# via Sec-WebSocket-Protocol. See HandlingEventPerformanceWebSocket.

# HTTP (and WebSocket upgrade) port. 8090 — distinct from part3/part4's 8080
# so this example's compose/verify stack can run alongside theirs without a
# port clash; bound to 0.0.0.0 in the container image, defaults to localhost
# for `quarkus:dev`.
quarkus.http.port=8090
quarkus.http.host=0.0.0.0

# The three subprotocol values this channel negotiates (DRQ-026, matches
# contracts/asyncapi.yaml's servers.local.bindings.ws.headers.Sec-WebSocket-Protocol
# enum exactly): the bare, pre-Part-5 value and its explicit +json alias both
# select the JSON path; +protobuf selects the binary path. Vert.x picks the
# first of THIS list that the client also offered and echoes it back in the
# handshake response — HandlingEventPerformanceWebSocket#onOpen reads the
# result via WebSocketConnection#subprotocol().
quarkus.websockets-next.server.supported-subprotocols=handling-events.v1,handling-events.v1+json,handling-events.v1+protobuf

# OTel is wired (quarkus-opentelemetry) but the SDK is disabled by default —
# same convention as part3/part4.
quarkus.otel.sdk.disabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=part5-performance-quarkus
