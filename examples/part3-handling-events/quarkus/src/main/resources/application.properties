# Part 3 "Handling It" example — Quarkus HandlingEvent WebSocket push feed.

# HTTP (and WebSocket upgrade) port. Bound to 0.0.0.0 in the container image
# via quarkus.http.host below; defaults to localhost for `quarkus:dev`.
quarkus.http.port=8080

# Bind to all interfaces so the containerized app is reachable from outside
# the container (see Containerfile). Harmless for local `quarkus:dev`.
quarkus.http.host=0.0.0.0

# OTel is wired (quarkus-opentelemetry) but the SDK is disabled by default —
# no telemetry is generated or exported until explicitly turned on, e.g.
# `QUARKUS_OTEL_SDK_DISABLED=false` plus a reachable OTLP collector.
quarkus.otel.sdk.disabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=part3-handling-events-quarkus
