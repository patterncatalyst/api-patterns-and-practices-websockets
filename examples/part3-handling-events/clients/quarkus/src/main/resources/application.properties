# Part 3 "Handling It" / Ch10 example — handling-events consuming client.

# This app's OWN HTTP port (WebSockets Next's client support still needs an
# HTTP server bootstrapped, even though this app serves nothing itself) —
# deliberately NOT 8080/8081, which are the Quarkus and Python SERVERS this
# client connects to.
quarkus.http.port=${CLIENT_HTTP_PORT:8079}
quarkus.http.host=0.0.0.0

# Target channel — point at either server (same contract, either stack):
#   ws://localhost:8080  (../../quarkus)
#   ws://localhost:8081  (../../python)
client.ws.base-uri=${CLIENT_WS_BASE_URI:ws://localhost:8080}
client.ws.booking-id=${CLIENT_BOOKING_ID:bkg_01HZY3KX7QZJ8N6VWT2E4R9F0A}

# Reconnect backoff: delay = min(max-delay-ms, base-delay-ms * 2^attempt),
# then +/- jitter-ratio applied as a uniform random multiplier. See
# ReconnectingClient.
client.reconnect.base-delay-ms=${CLIENT_RECONNECT_BASE_DELAY_MS:500}
client.reconnect.max-delay-ms=${CLIENT_RECONNECT_MAX_DELAY_MS:30000}
client.reconnect.jitter-ratio=${CLIENT_RECONNECT_JITTER_RATIO:0.2}

# Backpressure: bounded queue between the WebSocket callback thread and the
# (possibly slower) consumer. policy is BLOCK (the default — the callback
# thread awaits room in the queue, which is the safe default: it never loses
# a frame, at the cost of slowing frame consumption to the consumer's pace)
# or DROP_OLDEST (never blocks the callback thread; evicts the oldest
# buffered frame to make room, trading data loss for liveness). See
# EventBuffer. consumer.delay-ms artificially slows the consumer so the
# chosen policy's effect is observable (0 = no artificial delay).
client.buffer.capacity=${CLIENT_BUFFER_CAPACITY:16}
client.buffer.policy=${CLIENT_BUFFER_POLICY:BLOCK}
client.consumer.delay-ms=${CLIENT_CONSUMER_DELAY_MS:0}
