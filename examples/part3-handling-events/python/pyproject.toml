[project]
name = "handling-events-python"
version = "1.0.0"
description = "Ch9 example — Python native-websockets handling-events push feed (FastAPI for HTTP/app lifecycle, the websockets library drives the WS connection)."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.146.0",
    "opentelemetry-distro>=0.66b1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]
