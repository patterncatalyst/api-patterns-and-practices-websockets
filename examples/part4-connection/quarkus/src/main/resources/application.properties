# Part 4 "Connection Concerns" example — Quarkus HandlingEvent WebSocket
# feed, hardened with JWT auth (Ch17), heartbeats (Ch14), an in-band error
# envelope for malformed client input (Ch13), and bounded outbound
# backpressure (Ch12). See README.md for the close-code-per-concern map,
# shared exactly with the Python/`websockets`-library sibling app.

# HTTP (and WebSocket upgrade) port. Bound to 0.0.0.0 in the container image
# via quarkus.http.host below; defaults to localhost for `quarkus:dev`.
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# ── Ch17: JWT auth ──────────────────────────────────────────────────────
# HS256 shared secret validated in HandlingEventConnectionWebSocket#onOpen
# (see JwtHs256). The dev default below matches the Python sibling's and is
# NEVER used anywhere but local dev/test — set WS_JWT_SECRET in any
# shared/deployed environment.
ws.jwt.secret=${WS_JWT_SECRET:dev-secret-change-me}

# ── Ch14: heartbeats ─────────────────────────────────────────────────────
# Sends a ping from the server to each connected client every 20s — matches
# the Python sibling's `WS_PING_INTERVAL_S` default; override via
# QUARKUS_WEBSOCKETS_NEXT_SERVER_AUTO_PING_INTERVAL. A spec-compliant client
# (websocat included) answers automatically at the protocol level — no
# application code needed for the ping/pong exchange itself.
quarkus.websockets-next.server.auto-ping-interval=20

# Vert.x closes a connection (any connection, including an upgraded
# WebSocket) that has seen no read OR WRITE activity for this long. This is
# NOT what detects a dead peer on this channel — the server's own outbound
# ping (above) is write activity on the same connection, so idle-timeout
# keeps getting reset by the server's own pings regardless of whether the
# peer ever answers one. Left at a generous value purely as an unrelated
# backstop (e.g. a connection with auto-ping somehow disabled); override via
# QUARKUS_HTTP_IDLE_TIMEOUT. See HeartbeatLivenessSweep for the actual
# dead-peer detector.
quarkus.http.idle-timeout=40s

# The REAL Ch14 liveness check: HeartbeatLivenessSweep closes a connection
# (CloseCodes.LIVENESS_TIMEOUT, 4408) once this long has passed since its
# last pong (or, if it never pongs at all, its open time) — see that
# class's Javadoc. Default 45s = auto-ping-interval (20s) * 2 + 5s grace, a
# "missed two consecutive pongs" window. Override via
# EXAMPLE_HEARTBEAT_LIVENESS_TIMEOUT.
example.heartbeat.liveness-timeout=45s
# How often the sweep itself runs; override via
# EXAMPLE_HEARTBEAT_SWEEP_INTERVAL (e.g. shrink both this and
# auto-ping-interval/liveness-timeout together for a fast test — see
# verify.sh's Ch14 stage).
example.heartbeat.sweep-interval=5s

# ── Ch12: outbound backpressure ──────────────────────────────────────────
# See OutboundBackpressureGuard. 32 matches the Python sibling's
# OUTBOUND_QUEUE_MAXSIZE default — generous enough that this fixture's
# 3-event burst never trips it in normal operation. A verification run
# overrides EXAMPLE_BACKPRESSURE_MAX_PENDING_SENDS down to a small number to
# exercise the policy deterministically.
example.backpressure.max-pending-sends=32
# Matches the Python sibling's OUTBOUND_SEND_TIMEOUT_S default.
example.backpressure.send-timeout=5s
# CLOSE (default) or DROP — see OutboundBackpressureGuard.Policy.
example.backpressure.policy=CLOSE

# OTel is wired (quarkus-opentelemetry) but the SDK is disabled by default —
# same convention as part3.
quarkus.otel.sdk.disabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=part4-connection-quarkus
